# Collecte quotidienne a 7 h (heure de Paris) des 5 flux de test.
# Lancer a la main sans attendre 7 h :
#   kubectl -n m2ops create job --from=cronjob/collector collect-test
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collector
  labels:
    app.kubernetes.io/name: collector
spec:
  schedule: "0 7 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid       # jamais deux collectes en meme temps
  startingDeadlineSeconds: 3600   # rattrapage si le serveur etait indisponible a 7 h (1 h max)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1             # un seul nouvel essai
      activeDeadlineSeconds: 600  # collecte bloquee -> arretee apres 10 min
      template:
        metadata:
          labels:
            app.kubernetes.io/name: collector
            app.kubernetes.io/part-of: m2ops
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              # Image construite avec Podman puis importee dans k3s (voir README).
              # Etape suivante : ghcr.io/... avec imagePullPolicy: Always.
              image: localhost/m2ops-collector:0.1
              imagePullPolicy: Never
              args:
                - python
                - -m
                - src.collect
                - --source
                - Le Monde
                - --source
                - La Croix
                - --source
                - Le Dauphine Libere
                - --source
                - France 3 Bretagne
                - --source
                - Midi Libre
              envFrom:
                - secretRef:
                    name: m2ops-db
              env:
                - name: POSTGRES_HOST
                  value: db
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /app/data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              hostPath:
                path: /srv/appdata/m2ops/data
                type: Directory   # doit exister et appartenir a 1000:1000
            - name: tmp
              emptyDir: {}
