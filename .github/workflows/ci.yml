name: CI/CD M2Ops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff + flake8)
        run: |
          ruff check .
          flake8 src/ tests/ --max-line-length=100

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/adam-blf/projet-m2ops:${{ github.sha }} -t ghcr.io/adam-blf/projet-m2ops:latest .

      - name: Push Docker image
        # pas de push depuis une pull request (secrets absents, image non relue)
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u Adam-Blf --password-stdin
          docker push ghcr.io/adam-blf/projet-m2ops:${{ github.sha }}

      - name: Verify tag
        run: |
          echo "Image taggée : ghcr.io/adam-blf/projet-m2ops:${{ github.sha }}"